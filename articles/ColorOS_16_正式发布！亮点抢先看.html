<script>
    // Polyfill to activate WeChat lazy loaded SVGs and Images
    document.querySelectorAll('[data-lazy-bgimg]').forEach(el => {
        el.style.backgroundImage = 'url(' + el.getAttribute('data-lazy-bgimg') + ')';
    });
    document.querySelectorAll('img[data-src]').forEach(img => {
        img.src = img.getAttribute('data-src');
    });
    // Remove visibility hidden to show the content
    document.querySelectorAll('[style*="visibility: hidden"]').forEach(el => {
        el.style.visibility = 'visible';
    });
    
    // Auto-adjust height for the parent iframe
    window.onload = function() {
        // Force re-layout for some svgs
        window.dispatchEvent(new Event('resize'));
    };
    
    // Send height to parent for iframe resizing
    
    // Send height to parent reliably
    function sendHeight() {
        const h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight, document.getElementById('js_content') ? document.getElementById('js_content').scrollHeight : 0);
        if (h > 0) {
            window.parent.postMessage({type: 'resize', height: h, title: 'ColorOS_16_正式发布！亮点抢先看'}, '*');
        }
    }
    // Send immediately
    sendHeight();
    // Send on load
    window.addEventListener('load', sendHeight);
    // Send periodically just in case images load late
    setInterval(sendHeight, 1000);
</script>
