<div class="rich_media_content js_underline_content autoTypeSetting24psection fix_apple_default_style" id="js_content" style=""><section powered-by="yiwebsite &amp; SVG黑科技排版" data-wechat="SVG2021 &amp; kysvgyy" style="user-select: text; overflow: hidden; text-align: center; line-height: 0; visibility: visible; margin-bottom: 0px;"><section style="user-select: text; overflow: hidden; text-align: center; line-height: 0; visibility: visible;"><section style="overflow: hidden; width: 100%; height: 0px !important; margin-top: 0px !important; visibility: visible;"><svg style="display: block; line-height: 0; opacity: 0; visibility: visible;" viewBox="0 0 1080 1080" role="img" aria-label="插图"><text transform="matrix(1 0 0 1 22 36)" style="visibility: visible;"><tspan leaf="" x="0" y="0" font-family="'PingFangSC-Light-GBpc-EUC-H'" font-size="8px" style="visibility: visible;">vivo新春新玩法OriginOS陪你过大年 马上好运来 秒抢引擎抢红包 &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; 红包提醒速度、触控响应速度、网络资源调度全链路优化，抢红包更流畅，好运快人一步 * &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; 小贴士：抢红包速度不同机型表现可能存在差异，最终抢红包结果受具体网络环境等多重客观因素影响，效果以实际为准。 &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; 马上换新装 vivo全家桶主题焕新 vivo系列手机主题、手表主题、耳机主题、Pad壁纸精彩焕新，祝你年年“有钱花” &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; 底部小字： 限时上线至3月10日 神驹贺岁新春主题 国风入屏，多彩骏马齐贺岁，年味“活”起来 * &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; 小贴士：前往主题App搜索「神驹贺岁」即可下载体验。 趣味光栅上新 图集新增景深效果，美图上屏不遮挡，更有空间感 &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; 小V建议新春卡片 贴心祝福，年味满满 * &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; 小贴士：小V建议升级至V12.1.8版本，并将智慧服务升级至4.0.7.3版本即可体验。不同时间段卡片推荐服务有所不同，具体请以实际使用的情况为准。 &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; 横向个性时钟屏增加农历快捷信息 农历节日一眼可见，从从容容过大年 锁屏景深支持添加小组件 &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; 有景深，也有小组件，颜值、效率都拉满 马上出去玩 新春相册水印 水印一加，秒变新春福照 * 小贴士：OriginOS &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; 6用户将相册升级至V10.0.10.15及以上版本，OriginOS 5用户升级至V9.4.6.5以上版本即可使用 热点上岛 &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; 热点连接数量一看知，流量共享更便捷 还有更多贴心功能 陪你一起欢度假期 摇一摇群组分享 &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; 新春原图批量秒分享，安卓13及以上vivo手机都支持 * 小贴士：安卓 13及以上的vivo手机，更新至互传App V7.0.9.5 &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; 及以上版本即可在App内摇一摇使用；若系统为OriginOS 6，还支持在桌面、相册、文件管理系统应用中直接摇一摇操作。 &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; LivePhoto AI消除 路人一键消，春节Live轻松出片 小V建议 火车出行通知 行程动态一目了然，春节游玩“马上”出发 &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; 蓝心小V旅行路书 攻略智能识别，一键生成路书 小V写作 AI神回复，拜年轻松应对 部分功能将随OriginOS &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; 6近期系统版本推送 在升级页面中申请尝鲜后即可体验 &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; 路径：设置&gt;系统管理与升级&gt;系统升级&gt;右上角按钮&gt;升级尝鲜&gt;新版本尝鲜卡片，点击“立即更新” &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; 这个新年，不仅有贴心的功能陪伴你 更有OriginOS微信红包封面为你带来好彩头 上一轮没抢到的朋友，这次别错过 &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; 点击领取，马上有福 * &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; 本页面所展示的产品界面与功能说明（包括但不限于UI、背景、产品功能、手机轮察或手机外观图等）仅供参考，部分功能可能因系统版本、机型不同而存在差异，请以实际呈现效果为准。</tspan></text></svg></section></section><svg style="background-size: 100%; background-repeat: no-repeat; display: block; line-height: 0; transform: scale(1); margin-top: -1px; background-image: url('../../../assets/legacy/interactive/28ae498fa4dfcd899e8781de88d285a5.png'); visibility: visible;" viewBox="0 0 1080 818" data-lazy-bgimg="../../../assets/legacy/interactive/d8e3eabe01f68d9c82b1eefac4407172.png" class="" role="img" aria-label="插图" data-fail="0"></svg><svg style="background-size: 100%; background-repeat: no-repeat; display: block; line-height: 0; transform: scale(1); margin-top: -1px; background-image: url('../../../assets/legacy/interactive/0abdb33705533be3a0453bd316e68f49.png'); visibility: visible;" viewBox="0 0 1080 1704" data-lazy-bgimg="../../../assets/legacy/interactive/7c8aa76d49bb37c709a17a72b6c773c5.png" class="" role="img" aria-label="插图" data-fail="0"></svg><svg style="background-size: 100%; background-repeat: no-repeat; display: block; line-height: 0; transform: scale(1); margin-top: -1px; background-image: url('../../../assets/legacy/interactive/8b4184e8d29248e9703d403fb35a0e88.png');" viewBox="0 0 1080 1586" data-lazy-bgimg="../../../assets/legacy/interactive/22546258291d4029969db1df737f9072.png" class="" role="img" aria-label="插图" data-fail="0"></svg><svg style="background-size: <script>
(()=>{const id=document.body.dataset.compatId;const report=()=>parent.postMessage({type:'os-archive:resize',id,height:Math.max(document.documentElement.scrollHeight,document.body.scrollHeight)},'*');
const reveal=(el)=>{const url=el.getAttribute('data-lazy-bgimg');if(url){const probe=new Image();probe.onload=()=>{el.style.setProperty('background-image','url("'+url+'")','important');report()};probe.onerror=()=>el.insertAdjacentHTML('afterend','<div class="media-fallback">该背景媒体暂不可用</div>');probe.src=url}}
const observer='IntersectionObserver'in window?new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){reveal(entry.target);observer.unobserve(entry.target)}}),{rootMargin:'800px 0px'}):null;
document.querySelectorAll('[data-lazy-bgimg]').forEach(el=>observer?observer.observe(el):reveal(el));document.querySelectorAll('img[data-src]').forEach(img=>{img.loading='lazy';img.src=img.dataset.src});document.querySelectorAll('img').forEach(img=>img.addEventListener('error',()=>{if(img.dataset.failed)return;img.dataset.failed='1';const fallback=document.createElement('div');fallback.className='media-fallback';fallback.textContent='该图片暂不可用';img.replaceWith(fallback);report()}));
if('ResizeObserver'in window)new ResizeObserver(report).observe(document.body);addEventListener('load',report);document.fonts?.ready.then(report);setTimeout(report,100);setTimeout(report,600);setTimeout(report,1600)})();
